spring.datasource.url=jdbc:h2:mem:pawly_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.sql.init.mode=never

# ── Stripe (Test) ─────────────────────────────────────────────
# Placeholder: StripeConfig checks for sk_test_ prefix.
# Integration tests that exercise real Stripe API are skipped without a real key.
stripe.secret.key=sk_test_placeholder_for_unit_tests_only
stripe.webhook.secret=whsec_test_placeholder

# Recommendation client: nothing listens here, so tests exercise the content-based fallback.
pawly.ai.base-url=http://127.0.0.1:9
pawly.ai.connect-timeout-ms=300
pawly.ai.read-timeout-ms=300
pawly.ai.max-retries=1
pawly.ai.internal-token=
