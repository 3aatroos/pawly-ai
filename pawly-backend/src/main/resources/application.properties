#  Server
server.port=8081

#  DataSource 
spring.datasource.url=jdbc:mysql://localhost:3306/pawly_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#  JPA / Hibernate 
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# SQL init (run schema.sql on startup) 
spring.sql.init.mode=never
spring.sql.init.schema-locations=classpath:schema.sql
spring.jpa.defer-datasource-initialization=true

#  JWT 
jwt.secret=PawlySecretKey2024PawlySecretKey2024PawlySecretKey2024PawlySecretKey2024
jwt.expiration=86400000

#  Multipart (profile photos) 
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Logging 
logging.level.com.pawly=DEBUG
logging.level.org.springframework.security=INFO
